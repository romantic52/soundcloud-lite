<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://w.soundcloud.com; frame-src https://w.soundcloud.com;">
<title>SoundCloud Lite</title>
<style>
  :root { color-scheme: dark; font: 15px/1.5 'Segoe UI', sans-serif; background: #111; color: #fafafa; }
  body { margin: 0; }
  main { padding: 24px; }
  h1 { margin: 0 0 18px; font-size: 21px; font-weight: 600; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, button { box-sizing: border-box; padding: 8px 12px; border: 1px solid #666; border-radius: 5px; font: inherit; }
  input { flex: 1 1 240px; min-width: 0; background: #191919; color: #fff; }
  input::placeholder { color: #b2b2b2; }
  button { background: #242424; color: #fff; cursor: pointer; }
  button[type=submit] { background: #fff; color: #111; border-color: #fff; }
  input:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  p { min-height: 1.5em; margin: 12px 0; color: #ccc; }
  iframe { display: block; width: 100%; height: 320px; border: 0; }
</style>
<main>
  <h1>SoundCloud Lite</h1>
  <form id="open">
    <input id="query" aria-label="Ссылка на трек, плейлист или поисковый запрос" placeholder="Ссылка на трек или название" autocomplete="off">
    <button type="submit">Открыть</button>
    <button id="search" type="button">Поиск и вход</button>
  </form>
  <p id="status" role="status"></p>
  <div id="player"></div>
</main>
<script>
  const query = document.querySelector('#query');
  const status = document.querySelector('#status');
  const player = document.querySelector('#player');
  let widgetApi;

  function trackUrl(value) {
    try {
      const absolute = /^[a-z][a-z0-9+.-]*:\/\//i.test(value) ? value : `https://${value}`;
      const url = new URL(absolute);
      const hosts = ['soundcloud.com', 'www.soundcloud.com', 'm.soundcloud.com', 'on.soundcloud.com', 'snd.sc'];
      if (url.protocol === 'https:' && !url.username && !url.password && hosts.includes(url.host)) return url;
    } catch { /* Ordinary search text is not a URL. */ }
    return null;
  }

  function browse() {
    const text = query.value.trim();
    const url = text && !trackUrl(text) ? new URL('https://soundcloud.com/search/sounds') : new URL('https://soundcloud.com/discover');
    if (url.pathname.startsWith('/search')) url.searchParams.set('q', text);
    window.open(url.href, '_blank', 'noopener');
  }

  function loadWidgetApi() {
    if (!widgetApi) {
      widgetApi = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://w.soundcloud.com/player/api.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.append(script);
      }).catch((error) => {
        widgetApi = undefined;
        throw error;
      });
    }
    return widgetApi;
  }

  async function openTrack(track) {
    const url = new URL('https://w.soundcloud.com/player/');
    url.search = new URLSearchParams({ url: track.href, show_comments: 'false', show_reposts: 'false' });
    const frame = document.createElement('iframe');
    frame.title = 'Плеер SoundCloud';
    frame.allow = 'autoplay';
    frame.src = url.href;
    status.textContent = 'Загружаю плеер…';
    player.replaceChildren(frame);
    try {
      await loadWidgetApi();
      if (!frame.isConnected) return;
      const widget = SC.Widget(frame);
      widget.bind(SC.Widget.Events.READY, () => {
        if (frame.isConnected) status.textContent = '';
      });
      widget.bind(SC.Widget.Events.ERROR, () => {
        if (frame.isConnected) status.textContent = 'SoundCloud не смог воспроизвести эту ссылку.';
      });
    } catch {
      if (frame.isConnected) status.textContent = 'Если плеер не открылся, проверь подключение и повтори.';
    }
  }

  document.querySelector('#search').addEventListener('click', browse);
  document.querySelector('#open').addEventListener('submit', (event) => {
    event.preventDefault();
    const value = query.value.trim();
    if (!value) return query.focus();
    const track = trackUrl(value);
    if (track) openTrack(track);
    else browse();
  });
</script>
</html>
