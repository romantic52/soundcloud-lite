[package]
name = "soundcloud-lite"
version = "0.1.0"
edition = "2024"
autobins = false
default-run = "soundcloud-lite"

[[bin]]
name = "soundcloud-lite"
path = "src/player.rs"

[[bin]]
name = "soundcloud-lite-api"
path = "src/main.rs"
required-features = ["native-api"]

[features]
native-api = ["dep:anyhow", "dep:base64", "dep:keyring", "dep:open", "dep:rand", "dep:serde", "dep:serde_json", "dep:sha2", "dep:slint", "dep:ureq", "windows/Foundation", "windows/Media_Core", "windows/Media_Playback", "windows/Win32_System_WinRT"]

[dependencies]
anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
keyring = { version = "3.6", features = ["windows-native"], optional = true }
open = { version = "5", optional = true }
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"], optional = true }
ureq = { version = "2.12", features = ["json", "native-certs"], optional = true }
url = "2"
webview2-com = "0.39.1"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
